repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
  - repo: local
    hooks:
      - id: python-tests
        name: Run Python unit tests
        entry: python3 -m unittest discover tests
        language: system
        pass_filenames: false
        always_run: true
